<svg width="360" height="120" viewBox="0 0 360 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Foda Elections brand logo</title>
  <desc id="desc">Bilingual logotype for Foda Elections | فوده مننا featuring a ballot emblem and modern typography.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="120%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="55%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="objectBoundingBox">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feOffset dy="4" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18" />
      </feComponentTransfer>
      <feBlend in="offset" in2="SourceGraphic" mode="normal" />
    </filter>
  </defs>
  <g filter="url(#softShadow)">
    <rect x="12" y="20" width="92" height="92" rx="28" fill="url(#brandGradient)" opacity="0.92" />
    <rect x="24" y="32" width="68" height="68" rx="20" fill="#F3F4F6" opacity="0.4" />
    <rect x="30" y="38" width="56" height="56" rx="18" fill="url(#brandGradient)" opacity="0.85" />
    <path d="M84 44c-6.2-9.8-17-16-28.9-16C36.9 28 22 42.9 22 61.1c0 18.2 14.9 33.1 33.1 33.1 12.8 0 24-7.3 29.4-18.3l-10.8-6.1c-3.7 7.6-11.5 12.9-20.6 12.9-12.6 0-22.8-10.2-22.8-22.8S40.5 37 53.1 37c7.3 0 13.8 3.5 18 8.9L84 44Z" fill="rgba(243, 244, 246, 0.35)" />
    <path d="M90 60.5c0 17.4-14.1 31.5-31.5 31.5S27 77.9 27 60.5 41.1 29 58.5 29 90 43.1 90 60.5Z" stroke="#F3F4F6" stroke-opacity="0.35" stroke-width="2" />
    <path d="M68.8 49.6 55.1 66.2l-7.6-7a3 3 0 0 0-4.2 4.2l9.8 9a3 3 0 0 0 4.5-.3l16-19.8a3 3 0 0 0-4.8-3.7Z" fill="#FACC15" />
    <circle cx="85" cy="45" r="7" fill="#FACC15" />
  </g>
  <g transform="translate(120, 36)" fill="url(#textGradient)" font-family="'Inter', 'Noto Kufi Arabic', 'Cairo', 'Helvetica Neue', sans-serif">
    <text x="0" y="34" font-size="34" font-weight="700" letter-spacing="0.01em">Foda Elections</text>
    <text x="0" y="68" font-size="28" font-weight="600" fill="#0F172A" opacity="0.92" letter-spacing="0.02em">فوده مننا</text>
  </g>
