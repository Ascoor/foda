    <path d="M80.4 54.2 59.3 78.4l-9.7-9.1a3.4 3.4 0 0 0-4.8 4.8l12.3 11.5a3.4 3.4 0 0 0 5-.4l21.8-26.8a3.4 3.4 0 0 0-5.5-4.2Z" fill="#FACC15" />
    <circle cx="92" cy="44" r="6" fill="#FACC15" />
  </g>
