name: foda

services:
  db:
    image: mysql:8.0
    container_name: foda-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: foda
      MYSQL_USER: foda
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: foda-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: foda
      DB_USERNAME: foda
      DB_PASSWORD: secret


  nginx:
    image: nginx:alpine
    container_name: foda-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf

  frontend:
    image: node:20-alpine
    container_name: foda-frontend
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./frontend:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"

volumes:
  db-data:
