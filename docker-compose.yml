version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: foda-backend
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: foda
      DB_USERNAME: foda
      DB_PASSWORD: secret

    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: foda-nginx
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - backend

  frontend:
    image: node:20-alpine
    container_name: foda-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"

  db:
    image: mysql:8.0
    container_name: foda-db
    environment:
      MYSQL_DATABASE: foda
      MYSQL_USER: foda
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
